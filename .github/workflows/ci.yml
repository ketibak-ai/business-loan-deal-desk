name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests evals
      - name: Engine, API, agent-loop and JS parity tests
        run: pytest -q -p no:logging
      - name: Retrieval eval (offline)
        run: python evals/retrieval_eval.py --min-hit3 1.0
      - name: Example analysis
        run: dealdesk analyze
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t business-loan-deal-desk:ci .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 business-loan-deal-desk:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/ | grep -q "Deal Desk"
          curl -sf localhost:8000/api/example > example.json
          curl -sf -X POST localhost:8000/api/analyze -H 'content-type: application/json' -d @example.json \
            | python -c "import json,sys; r=json.load(sys.stdin); assert r['bank_view']['room_to_negotiate_bps'] > 0; print('walk-away', r['bank_view']['rates_pct']['walk_away'])"
          curl -sf -X POST localhost:8000/api/compare -H 'content-type: application/json' \
            -d '{"offers":[{"name":"A","amount":500000,"rate":7.1,"termY":5,"amortY":5}]}'
          docker logs api | tail -5
